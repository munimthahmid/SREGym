agents:
  - name: stratus
    kickoff_command: python -m clients.stratus.stratus_agent.driver.driver
    kickoff_workdir: .
    kickoff_env: null
    install_script: null
    agent_version: null
  - name: autosubmit
    kickoff_command: python -m clients.autosubmit.autosubmit_agent
    kickoff_workdir: .
    kickoff_env: null
    install_script: null
    agent_version: null
  - name: codex
    kickoff_command: python -m clients.codex.driver
    kickoff_workdir: .
    kickoff_env: null
    install_script: install-codex.sh
    agent_version: null
  - name: claudecode
    kickoff_command: python -m clients.claudecode.driver
    kickoff_workdir: .
    kickoff_env: null
    install_script: install-claudecode.sh
    agent_version: null
  - name: "debug"
    kickoff_command: "python -c \"import signal; signal.pause()\""
    install_script: null
    agent_version: null
  - name: gemini
    kickoff_command: python -m clients.geminicli.driver
    kickoff_workdir: .
    kickoff_env: null
    install_script: install-gemini.sh
    agent_version: null
  - name: opencode
    kickoff_command: python -m clients.opencode.driver
    kickoff_workdir: .
    kickoff_env: null
    install_script: install-opencode.sh
    agent_version: null
  - name: tierzero
    kickoff_command: python -m clients.tierzero.driver
    kickoff_workdir: .
    kickoff_env:
      TIERZERO_API_URL: "https://app.tierzero.ai"
      TIERZERO_ORG_API_KEY: "<your-api-key>"
    install_script: null
    agent_version: null
    container_isolation: false
  - name: copilot
    kickoff_command: python -m clients.copilot.driver
    kickoff_workdir: .
    kickoff_env: null
    install_script: install-copilot.sh
    agent_version: null
  - name: cursor
    kickoff_command: python -m clients.cursor.driver
    kickoff_workdir: .
    kickoff_env: null
    install_script: install-cursor.sh
    agent_version: null
  - name: demo
    kickoff_command: python -m clients.demo.driver
    kickoff_workdir: .
    kickoff_env: null
    install_script: null
    agent_version: null
    container_isolation: false
  - name: cloudthinker
    kickoff_command: python -m clients.cloudthinker.driver
    kickoff_workdir: .
    kickoff_env:
      # The client talks to the platform through its `ct` dev CLI, which resolves
      # its compose slot from the checkout it runs in. Point CT_REPO_DIR and
      # CT_BIN at your own installation.
      CT_BIN: "/usr/local/bin/ct"
      CT_REPO_DIR: "/REPLACE-WITH-YOUR-CLOUDTHINKER-CHECKOUT"
      CT_TURN_TIMEOUT: "3600"
      CT_RCA_TIMEOUT: "3600"
      CT_MAX_APPROVALS: "20"
      # The workspace holds the cluster behind the problem: its MCP connections
      # are how the agent sees it and its Kubernetes connection is how the fix is
      # applied. A workspace id is scoped to one installation, so this is a
      # placeholder to replace, not a value to inherit.
      CT_WORKSPACE: "00000000-0000-0000-0000-000000000000"
      # The model tier to benchmark. The client does not fall back to a default:
      # a run labelled by a model it never named is not comparable.
      CT_SELECTION: "model:REPLACE-WITH-YOUR-MODEL"
      # One prompt pair per mode; a prompt change ships as a new mode.
      CT_PROMPT_MODE: "scoped"
    install_script: null
    agent_version: null
    container_isolation: false

  # Same driver, same workspace -- the only difference is CT_LANE. A separate
  # agent name keeps the lanes apart: SREGym names the results file after the
  # agent, so these rows land in cloudthinker_rca_ALL_results.csv and cannot be
  # averaged into a chat-lane number by a careless glob.
  - name: cloudthinker_rca
    kickoff_command: python -m clients.cloudthinker.driver
    kickoff_workdir: .
    kickoff_env:
      CT_LANE: "rca_flow"
      CT_BIN: "/usr/local/bin/ct"
      CT_REPO_DIR: "/REPLACE-WITH-YOUR-CLOUDTHINKER-CHECKOUT"
      CT_TURN_TIMEOUT: "3600"
      CT_RCA_TIMEOUT: "3600"
      CT_MAX_APPROVALS: "20"
      CT_WORKSPACE: "00000000-0000-0000-0000-000000000000"
      CT_SELECTION: "model:REPLACE-WITH-YOUR-MODEL"
      CT_PROMPT_MODE: "scoped"
    install_script: null
    agent_version: null
    container_isolation: false
  - name: jev_diag
    kickoff_command: python -m clients.jev_diag.driver
    kickoff_workdir: .
    kickoff_env:  # local experiment (v2-eval branch): v2 and v1 on the same cluster moment, several decision models
      JEV_DIAG_MODE: "arms"
      JEV_ARMS: "v2=typesafe/jev-1.13,v2=openai/gpt-6-luna-decisions,v2=microsoft/microsoft-decision-1,v2=liquid/d1,v2=liquid/d1-ultra,v2=cloudflare/clef,v2=cloudflare/clef-omni,v2=nace-ai/drex-v2.0,v2=inception/mercury-decide,v2=upstage/solar-decide,v1=typesafe/jev-1.13,v1=openai/gpt-6-luna-decisions,v1=microsoft/microsoft-decision-1,v1=liquid/d1,v1=liquid/d1-ultra,v1=cloudflare/clef,v1=cloudflare/clef-omni,v1=nace-ai/drex-v2.0,v1=inception/mercury-decide,v1=upstage/solar-decide"
      JEV_ARMS_SUBMIT: "0"
    install_script: null
    agent_version: null
  - name: jev_agent
    kickoff_command: python -m clients.jev_agent.driver
    kickoff_workdir: .
    kickoff_env: null
    install_script: install-codex.sh  # Codex CLI for the subscription LLM (escalation and report)
    agent_version: null
